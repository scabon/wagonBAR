name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: web-ext lint
        # exits non-zero on errors; warnings are reported but tolerated
        run: npx --yes web-ext lint --source-dir extension

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install marionette_driver
        run: pip install marionette_driver

      - name: Locate Firefox
        shell: pwsh
        run: |
          $ff = (Get-Command firefox.exe -ErrorAction SilentlyContinue).Source
          if (-not $ff) {
            $ff = "C:\Program Files\Mozilla Firefox\firefox.exe"
          }
          if (-not (Test-Path $ff)) {
            winget install --id Mozilla.Firefox --silent --accept-source-agreements --accept-package-agreements
          }
          if (-not (Test-Path $ff)) {
            # winget may have installed a new major version path
            $ff = Get-ChildItem "C:\Program Files\Mozilla Firefox*\firefox.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $ff -or -not (Test-Path $ff)) { throw "firefox.exe not found" }
          Write-Output "Firefox: $ff"
          "FIREFOX_BIN=$ff" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Phase A - install, empty badge, popup logic
        run: python -X utf8 tests/e2e/wagonbar_e2e.py a

      - name: Phase B - seeded storage, badge count
        run: python -X utf8 tests/e2e/wagonbar_e2e.py b
