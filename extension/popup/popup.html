<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNCF Voucher Reminder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>SNCF Vouchers</h1>
    
    <div class="section">
      <h2>Add New Voucher</h2>
      <form id="addVoucherForm">
        <div class="form-group">
          <label for="voucherCode">Code:</label>
          <input type="text" id="voucherCode" placeholder="e.g., ABC123XYZ" required>
        </div>
        <div class="form-group">
          <label for="expiryDate">Expiration Date:</label>
          <input type="date" id="expiryDate" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Voucher</button>
      </form>
    </div>

    <div class="section">
      <h2>Your Vouchers</h2>
      <div id="voucherList" class="voucher-list">
        <p class="empty-message">No vouchers yet. Add one above!</p>
      </div>
    </div>

    <div class="section stats">
      <p>Total: <span id="totalVouchers">0</span> vouchers</p>
      <p>Valid: <span id="validVouchers">0</span> vouchers</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
