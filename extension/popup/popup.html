<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wagonBar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>wagonBar — SNCF Vouchers</h1>

    <div class="section">
      <h2>Add New Voucher</h2>
      <form id="addVoucherForm">
        <div class="form-group">
          <label for="voucherCode">Code:</label>
          <input type="text" id="voucherCode" placeholder="e.g., ABC123XYZ" required>
        </div>
        <div class="form-group">
          <label for="expiryDate">Expiration Date:</label>
          <div class="date-row">
            <div class="date-input-wrap">
              <span id="expiryGhost" class="input-ghost" aria-hidden="true"></span>
              <input type="text" id="expiryDate" placeholder="YYYY-MM-DD" inputmode="numeric" autocomplete="off" required>
            </div>
            <button type="button" id="calendarToggle" class="calendar-btn" aria-label="Pick a date from the calendar" title="Pick a date">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <rect x="1.5" y="3" width="13" height="11.5" rx="1.5"></rect>
                <path d="M1.5 6.5h13M4.5 1v3M11.5 1v3"></path>
              </svg>
            </button>
          </div>
          <div id="calendarPanel" class="calendar-panel" hidden></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Add Voucher</button>
          <button type="button" id="cancelEditBtn" class="btn btn-secondary" hidden>Cancel</button>
        </div>
      </form>
      <div class="status-slot">
        <div id="statusMessage" class="status-message" title="Click to dismiss" hidden></div>
      </div>
    </div>

    <div class="section">
      <div class="list-header">
        <h2>Your Vouchers</h2>
        <div class="list-controls">
          <button type="button" id="removeExpiredBtn" class="btn btn-danger remove-expired-btn" hidden>Remove expired</button>
          <select id="sortOrder" title="Sort order">
            <option value="date">By date</option>
            <option value="code">By code</option>
          </select>
        </div>
      </div>
      <div id="voucherList" class="voucher-list">
        <p class="empty-message">No vouchers yet. Add one above!</p>
      </div>
    </div>

    <div class="section stats">
      <p>Total: <span id="totalVouchers">0</span> vouchers</p>
      <p>Valid: <span id="validVouchers">0</span> vouchers</p>
    </div>
  </div>

  <script src="../vendor/browser-polyfill.js"></script>
  <script src="../shared/sync-common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
